name: Bug report
description: Something in LangScope does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the [open issues](https://github.com/MohamedxChaouachi/LangScope/issues) first.
        For a security problem, do not use this form: follow [SECURITY.md](https://github.com/MohamedxChaouachi/LangScope/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Choose FROM ... and TO ...
        2. Select a region over ...
        3. Click Start
    validations:
      required: true
  - type: input
    id: languages
    attributes:
      label: Language pair
      placeholder: ja -> en
  - type: dropdown
    id: device
    attributes:
      label: OCR device
      options:
        - CPU
        - NVIDIA GPU (CUDA)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: display
    attributes:
      label: Where the translation is shown
      options:
        - Live feed in the app
        - Desktop overlay
        - Both
        - Not relevant
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, display scaling (for example 150%) and number of monitors, Python version, LangScope commit, and the PyTorch, EasyOCR and Argos Translate versions (`pip list`).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with `$env:LANGSCOPE_LOGLEVEL = "DEBUG"; langscope` and paste the relevant part. Remove anything private, such as text that was on your screen.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: With Debug Mode on, if you can. Make sure they show nothing private.
