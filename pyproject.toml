# Tool configuration for LangScope. Packaging metadata is not defined here yet.

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra lists every skipped test with its reason in the summary.
addopts = "-ra"
qt_api = "pyqt6"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Rule families are enabled one at a time; each is added together with the fixes it needs.
select = [
    "E4",  # pycodestyle: import errors
    "E7",  # pycodestyle: statement errors (semicolons, ambiguous names, lambdas, bare except)
    "E9",  # pycodestyle: syntax and I/O errors
    "W",   # pycodestyle: whitespace and escape-sequence warnings
    "F",   # pyflakes: undefined names, unused imports and variables
    "UP",  # pyupgrade: modern syntax for the target Python version
    "B",   # flake8-bugbear: likely bugs and design problems
    "I",   # isort: import ordering
]
ignore = [
    # BaseOCR and BaseTranslator define optional hooks (set_language, set_preprocess_config,
    # clear_cache) that are deliberately empty and documented as "no-op by default".
    "B027",
    # The zip() calls pair lists that are aligned by construction. strict=True would turn a
    # length mismatch into an exception inside a QThread, which aborts the whole process under
    # PyQt6 instead of degrading gracefully.
    "B905",
]
